name: Telegram history import

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2026-01-01"
      to_date:
        description: "End date inclusive (YYYY-MM-DD)"
        required: false
        default: "2026-11-20"
  # Enable a daily incremental sync only after the initial import is verified.
  # schedule:
  #   - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-history-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_STAFF_IDS: ${{ vars.TELEGRAM_STAFF_IDS }}
      TELEGRAM_IMPORT_FROM: "${{ inputs.from_date || '2026-01-01' }}T00:00:00+05:00"
      TELEGRAM_IMPORT_TO: "${{ inputs.to_date || '2026-11-20' }}T23:59:59+05:00"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt
      - name: Validate required secrets
        shell: bash
        run: |
          for name in TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING TELEGRAM_CHAT_ID NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for $name"
              exit 1
            fi
          done
      - name: Import Telegram history
        run: python collector/telegram_import.py
