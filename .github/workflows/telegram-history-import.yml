name: Telegram history import

on:
  workflow_dispatch:
    inputs:
      import_from:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      import_to:
        description: "End date, exclusive (YYYY-MM-DD)"
        required: true
        default: "2026-11-21"

permissions:
  contents: read

concurrency:
  group: telegram-history-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_STAFF_IDS: ${{ vars.TELEGRAM_STAFF_IDS }}
      TELEGRAM_IMPORT_FROM: ${{ inputs.import_from }}T00:00:00+05:00
      TELEGRAM_IMPORT_TO: ${{ inputs.import_to }}T00:00:00+05:00
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check required configuration
        shell: bash
        run: |
          test -n "$TELEGRAM_API_ID" || (echo "Missing TELEGRAM_API_ID secret" && exit 1)
          test -n "$TELEGRAM_API_HASH" || (echo "Missing TELEGRAM_API_HASH secret" && exit 1)
          test -n "$TELEGRAM_SESSION_STRING" || (echo "Missing TELEGRAM_SESSION_STRING secret" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "Missing TELEGRAM_CHAT_ID secret" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL variable" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Import Telegram history
        run: python collector/telegram_import.py
